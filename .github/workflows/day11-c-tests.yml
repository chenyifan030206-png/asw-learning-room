name: Day11 real C compile and queue regression

on:
  pull_request:
    paths:
      - 'courses.json'
      - '.github/workflows/day11-c-tests.yml'
  push:
    branches: [main]
    paths:
      - 'courses.json'
      - '.github/workflows/day11-c-tests.yml'

jobs:
  day11-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the six canonical Day11 assets from courses.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('courses.json').read_text(encoding='utf-8'))
          lesson=data['lessons']['11']
          folder=pathlib.Path('day11-c-ci')
          folder.mkdir()
          for asset in lesson['assets']:
              filename=asset['name']
              assert filename in {'sensor_queue.h','sensor_queue.c','demo.c','test_sensor_queue.c','CMakeLists.txt','README.md'}
              (folder/filename).write_text(asset['text'], encoding='utf-8')
          print('Extracted:',', '.join(p.name for p in folder.iterdir()))
          PY
      - name: GCC -Werror real build and separate test program
        run: |
          set -euxo pipefail
          cd day11-c-ci
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -g demo.c sensor_queue.c -o sensor_demo -lm
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -g test_sensor_queue.c sensor_queue.c -o sensor_tests -lm
          ./sensor_tests
      - name: Run C executable for all five scenarios and assert results
        run: |
          python3 - <<'PY'
          import subprocess
          exe='./day11-c-ci/sensor_demo'
          cases={
            0: ['step=2 op=pop status=0 head=1 tail=2 count=1 cycle=100'],
            1: ['step=6 op=push cycle=6/6 status=-3 head=1 tail=1 count=4',
                'step=10 op=pop status=0 head=1 tail=1 count=0 cycle=5'],
            2: ['step=1 op=push cycle=8/7 status=-2 head=0 tail=1 count=1',
                'step=4 op=pop status=0 head=2 tail=2 count=0 cycle=8'],
            3: ['step=0 op=pop status=-3 head=0 tail=0 count=0',
                'step=3 op=pop status=-3 head=1 tail=1 count=0'],
            4: ['step=0 op=push cycle=4/4 status=-2 head=0 tail=0 count=0',
                'step=2 op=pop status=0 head=1 tail=1 count=0 cycle=5']
          }
          for scenario,requirements in cases.items():
              r=subprocess.run([exe],input=f'{scenario}\n',text=True,capture_output=True,check=True)
              print(f'\n--- scenario {scenario} ---\n{r.stdout}')
              for needle in requirements:
                  assert needle in r.stdout, f'Unexpected C output for scenario {scenario}: {needle}'
          PY
      - name: Real CMake and CTest
        run: |
          cmake -S day11-c-ci -B day11-c-ci/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build day11-c-ci/build
          ctest --test-dir day11-c-ci/build --output-on-failure

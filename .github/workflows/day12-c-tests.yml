name: Day12 real C and interface contract checks

on:
  pull_request:
    paths:
      - 'courses.json'
      - 'pages-runtime.js'
      - 'app.js'
      - '.github/workflows/day12-c-tests.yml'
  push:
    branches: [main]
    paths:
      - 'courses.json'
      - 'pages-runtime.js'
      - 'app.js'
      - '.github/workflows/day12-c-tests.yml'

jobs:
  real-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the exact C sources shipped to Day12 learners
        run: |
          python3 - <<'PY'
          import pathlib, json
          lesson=json.loads(pathlib.Path('courses.json').read_text(encoding='utf-8'))['lessons']['12']
          folder=pathlib.Path('day12-ci');folder.mkdir()
          names={'vehicle_if.h','app.h','app.c','mock.h','mock.c','demo.c','test_app.c','CMakeLists.txt','README.md'}
          for x in lesson['assets']:
              assert x['name'] in names, x['name']
              (folder/x['name']).write_text(x['text'],encoding='utf-8')
          assert {x.name for x in folder.iterdir()}==names
          PY
      - name: Compile both independent main programs with GCC
        run: |
          set -euxo pipefail
          cd day12-ci
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -g demo.c app.c mock.c -o vehicle_demo -lm
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -g test_app.c app.c mock.c -o vehicle_tests -lm
          ./vehicle_tests
      - name: Check all five cases against actual C output
        run: |
          python3 - <<'PY'
          import subprocess
          expected={
            0:["step=0 status=0 published=1 valid=1 warning=0 cycle=100",
               "step=1 status=0 published=1 valid=1 warning=1 cycle=101",
               "step=2 status=0 published=1 valid=1 warning=0 cycle=102"],
            1:["step=1 status=-2 published=1 valid=0 warning=0 cycle=0"],
            2:["step=1 status=-3 published=1 valid=0 warning=0 cycle=101"],
            3:["step=1 status=-4 published=0"],
            4:["step=1 status=-3 published=1 valid=0 warning=0 cycle=101"]
          }
          for case,lines in expected.items():
              out=subprocess.run(["./day12-ci/vehicle_demo"],input=f"{case}\n",capture_output=True,text=True,check=True).stdout
              print(f"CASE {case}:\n{out}")
              assert all(x in out for x in lines),(case,lines)
          PY
      - name: CMake and CTest from same extracted files
        run: |
          cmake -S day12-ci -B day12-ci/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build day12-ci/build
          ctest --test-dir day12-ci/build --output-on-failure
      - name: JavaScript syntax and all lesson regressions
        run: |
          node --check pages-runtime.js
          node --check app.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('pages-runtime.js','utf8');
          const cx={window:{dispatchEvent(){}},document:{documentElement:{dataset:{courseVersion:'test'}}},location:{href:'https://example.org/'},URL:class{constructor(){this.pathname='/';this.searchParams={set(){}}}},fetch:async()=>({ok:true,json:async()=>({})}),localStorage:{getItem(){return null},setItem(){}},crypto:{randomUUID(){return 'mock'}}};
          vm.createContext(cx);vm.runInContext(src,cx);
          let count=0;
          for(let day=1;day<=12;day++){
            const cases=cx.pagesRegression(day);
            for(const x of cases){if(!x.passed)throw Error('D'+day+' '+x.name+' failed: '+JSON.stringify(x.actual));count++;}
          }
          console.log('PASS: '+count+' JS regression cases across D01-D12');
          NODE
